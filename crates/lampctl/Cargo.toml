[package]
name = "lampctl"
description = "A ratatui TUI + CLI to control HID LampArray keyboard/device lighting with live preview."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["tui", "ratatui", "rgb", "keyboard", "lamparray"]
categories = ["command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "lampctl"
path = "src/main.rs"

[dependencies]
lamparray.workspace = true
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
